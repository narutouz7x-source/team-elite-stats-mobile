name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
        env:
          VITE_API_URL: https://team-elite-stats.vercel.app
      - run: npx cap add android
      - run: cp google-services.json android/app/google-services.json
      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          app = Path('android/app/build.gradle')
          s = root.read_text()
          if 'com.google.gms:google-services' not in s:
              marker = 'dependencies {\n'
              s = s.replace(marker, marker + "        classpath 'com.google.gms:google-services:4.4.2'\n", 1)
          root.write_text(s)
          a = app.read_text()
          if "id 'com.google.gms.google-services'" not in a:
              marker = "plugins {\n"
              a = a.replace(marker, marker + "    id 'com.google.gms.google-services'\n", 1)
          app.write_text(a)
          PY
      - run: cp assets/og-elite-icon.png assets/icon.png
      - run: npm install -D @capacitor/assets
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: og-elite-stats-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
