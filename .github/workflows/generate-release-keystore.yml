name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate permanent Android release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }

          keytool -genkeypair -v             -keystore og-elite-release.jks             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -alias "$KEY_ALIAS"             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=OG ELITE STATS, OU=Mobile, O=OG ELITE, L=Panipat, ST=Haryana, C=IN"

          echo "Keystore generated successfully."
          base64 -w 0 og-elite-release.jks > keystore.base64
          echo "Base64 keystore length: $(wc -c < keystore.base64) characters."

      - name: Display one-time Base64 value
        run: |
          echo "::warning::Copy the value below into the ANDROID_KEYSTORE_BASE64 GitHub secret."
          cat keystore.base64
